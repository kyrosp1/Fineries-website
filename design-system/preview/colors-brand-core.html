<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand core colors" subtitle="The four brand squares — indigo, gold, magenta, teal" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--slate)}
  
 .sq{width:150px;height:96px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
 .nm{font-weight:800;font-size:15px;font-family:var(--font-display)}
 .hx{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-top:2px}

</style></head><body><div class="row" style="gap:14px">
 <div class="sq" style="background:var(--blue)"><span class="nm">Blue</span><span class="hx">#3C4099</span></div>
 <div class="sq" style="background:var(--gold);color:#5a4600"><span class="nm">Gold</span><span class="hx">#FFC80C</span></div>
 <div class="sq" style="background:var(--magenta)"><span class="nm">Magenta</span><span class="hx">#C01891</span></div>
 <div class="sq" style="background:var(--teal)"><span class="nm">Teal</span><span class="hx">#08BCB3</span></div>
</div></body></html>
