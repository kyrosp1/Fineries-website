<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation / shadows" subtitle="Cool indigo-tinted shadows" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px;-webkit-font-smoothing:antialiased}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--mist)}
  
 .row{display:flex;gap:18px}
 .b{width:120px;height:74px;background:#fff;border-radius:14px;display:flex;align-items:flex-end;padding:8px}
 .b span{font-family:var(--font-mono);font-size:10px;color:var(--mist)}
 body{background:var(--paper)}

</style></head><body><div class="lbl" style="margin-bottom:16px">Elevation · cool blue-tinted</div><div class="row">
 <div class="b" style="box-shadow:var(--shadow-sm)"><span>sm</span></div>
 <div class="b" style="box-shadow:var(--shadow-md)"><span>md</span></div>
 <div class="b" style="box-shadow:var(--shadow-lg)"><span>lg</span></div>
 <div class="b" style="box-shadow:var(--shadow-brand)"><span>brand</span></div>
</div></body></html>
