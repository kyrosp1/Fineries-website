<!DOCTYPE html>
<!-- @dsCard group="Components" name="Cards" subtitle="Capability + case-study cards" viewport="700x220" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--paper);color:var(--fg-1);padding:22px;-webkit-font-smoothing:antialiased}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin-bottom:16px}
  .row{display:flex;gap:18px}

  /* ---- Capability card: single white surface, premium ---- */
  .card{flex:1;background:#fff;border-radius:20px;border:1px solid var(--line);
        box-shadow:0 1px 2px rgba(27,29,69,.04);padding:26px 24px;
        display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
  .chip{width:52px;height:52px;border-radius:15px;background:var(--blue-100);
        color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
  .chip svg{width:25px;height:25px;stroke-width:1.9}
  .card .eb{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:8px}
  .card .ti{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-bottom:8px}
  .card .ds{font-size:13.5px;color:var(--slate);line-height:1.55}
  .card .more{margin-top:18px;font-size:13px;font-weight:700;color:var(--blue);display:inline-flex;align-items:center;gap:6px}
  .card .more svg{width:15px;height:15px}

  /* ---- Case-study card: white surface, color as accent ---- */
  .work{flex:1;border-radius:20px;background:#fff;border:1px solid var(--line);padding:26px 24px;
        display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(27,29,69,.04);transition:box-shadow .25s,transform .25s}
  .work:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
  .work .tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
        color:var(--magenta-700);background:var(--magenta-100);padding:6px 12px;border-radius:999px;margin-bottom:22px}
  .work .metric{font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:-.02em;color:var(--blue);line-height:1}
  .work .client{font-size:14px;font-weight:700;color:var(--ink);margin-top:14px}
  .work .ds{font-size:13.5px;color:var(--slate);line-height:1.55;margin-top:6px}
  .work .link{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;color:var(--blue);margin-top:20px}
  .work .link svg{width:15px;height:15px}
</style></head><body>
<div class="lbl">Cards</div>
<div class="row">
  <div class="card">
    <div class="chip"><i data-lucide="layout-dashboard"></i></div>
    <div class="eb">Capability</div>
    <div class="ti">Experience design</div>
    <div class="ds">Websites, mobile apps and digital products, built to perform across every screen.</div>
    <span class="more">Explore <i data-lucide="arrow-right"></i></span>
  </div>
  <div class="work">
    <span class="tag">Social</span>
    <div class="metric">3.2M reach</div>
    <div class="client">Verde Foods</div>
    <div class="ds">Always-on social platform for a challenger FMCG brand.</div>
    <span class="link">View case study <i data-lucide="arrow-up-right"></i></span>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
