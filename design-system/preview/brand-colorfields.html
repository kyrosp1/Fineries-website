<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo on color fields" subtitle="Wordmark recolored on solid brand-color fields — the signature treatment" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tile{height:84px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .tile img{width:78%}
</style></head><body>
<div class="lbl">Logo on brand color fields — recolor for contrast</div>
<div class="grid">
  <div class="tile" style="background:var(--gold)"><img src="../assets/fineries-logo-blue-3x.png"></div>
  <div class="tile" style="background:var(--magenta)"><img src="../assets/fineries-logo-white-3x.png"></div>
  <div class="tile" style="background:var(--blue)"><img src="../assets/fineries-logo-gold-3x.png"></div>
  <div class="tile" style="background:var(--teal)"><img src="../assets/fineries-logo-blue-3x.png"></div>
  <div class="tile" style="background:var(--gold)"><img src="../assets/fineries-logo-teal-3x.png"></div>
  <div class="tile" style="background:var(--magenta)"><img src="../assets/fineries-logo-gold-3x.png"></div>
  <div class="tile" style="background:var(--gold)"><img src="../assets/fineries-logo-magenta-3x.png"></div>
  <div class="tile" style="background:var(--magenta)"><img src="../assets/fineries-logo-teal-3x.png"></div>
</div>
</body></html>
