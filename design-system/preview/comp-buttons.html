<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Pill primary, secondary, ghost, gold" viewport="700x170" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px;-webkit-font-smoothing:antialiased}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  
 .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
 .btn{font-family:var(--font-text);font-weight:700;font-size:15px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .16s cubic-bezier(.22,.61,.36,1)}
 .pill{border-radius:999px;padding:13px 26px}
 .pri{background:var(--blue);color:#fff;box-shadow:var(--shadow-brand)}
 .sec{background:var(--blue-100);color:var(--blue-700);border-radius:999px;padding:13px 26px}
 .ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);border-radius:999px;padding:11.5px 24px}
 .gold{background:var(--gold);color:#5a4600;border-radius:999px;padding:13px 26px}
 .sm{border-radius:10px;padding:9px 16px;font-size:13px}
 .lk{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
 .btn svg{width:17px;height:17px}

</style></head><body><div class="lbl" style="margin-bottom:14px">Buttons & actions</div>
 <div class="row">
   <button class="btn pill pri">Start a project <i data-lucide="arrow-right"></i></button>
   <button class="btn sec">See our work</button>
   <button class="btn ghost">Contact</button>
   <button class="btn gold">Let's talk</button>
 </div>
 <div class="row">
   <button class="btn pri sm">Submit</button>
   <button class="btn sec sm" style="border-radius:10px;padding:9px 16px">Cancel</button>
   <a class="lk" href="#">Read the case study →</a>
 </div><script>lucide.createIcons();</script></body></html>
