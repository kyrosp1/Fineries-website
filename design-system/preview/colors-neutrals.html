<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Cool, indigo-tinted grays" viewport="700x130" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--slate)}
  
 .swrap{display:flex;gap:8px}
 .s{flex:1;height:60px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}
 .s .n{font-size:10px;font-weight:700}.s .h{font-family:var(--font-mono);font-size:8px;color:var(--mist)}

</style></head><body><div class="lbl" style="margin-bottom:10px">Neutrals — cool / blue-tinted</div><div class="swrap"><div class="s" style="background:#16172B"><span class="n" style="color:#fff">ink</span><span class="h" style="color:#fff;opacity:.7">#16172B</span></div><div class="s" style="background:#4A4C63"><span class="n" style="color:#fff">slate</span><span class="h" style="color:#fff;opacity:.7">#4A4C63</span></div><div class="s" style="background:#84869B"><span class="n" style="color:#fff">mist</span><span class="h" style="color:#fff;opacity:.7">#84869B</span></div><div class="s" style="background:#E4E5EE"><span class="n" style="color:#16172b">line</span><span class="h" style="color:#16172b;opacity:.7">#E4E5EE</span></div><div class="s" style="background:#F1F2F8"><span class="n" style="color:#16172b">cloud</span><span class="h" style="color:#16172b;opacity:.7">#F1F2F8</span></div><div class="s" style="background:#FAFAFD"><span class="n" style="color:#16172b">paper</span><span class="h" style="color:#16172b;opacity:.7">#FAFAFD</span></div></div></body></html>
