<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Imagery treatment" subtitle="B&W knockout on the #3C4099 blue field, gold keyword + white copy" viewport="700x320" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px}
 .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin-bottom:14px}

 .stage{position:relative;height:262px;border-radius:12px;overflow:hidden;background:var(--field-blue);display:flex;align-items:center}
 .stage img{position:absolute;right:-4%;bottom:0;height:104%;object-fit:contain;object-position:bottom right}
 .copy{position:relative;z-index:2;padding:0 36px;max-width:60%}
 .kw{font-family:var(--font-display);font-weight:800;font-size:56px;color:var(--gold);letter-spacing:-.02em;line-height:1}
 .sub{font-family:var(--font-text);font-weight:400;color:#fff;font-size:18px;line-height:1.45;margin-top:14px;opacity:.96}
 .sub b{font-weight:800}
</style></head><body>
<div class="lbl">Imagery — high-contrast B&amp;W knockouts on the #3C4099 blue field</div>
<div class="stage">
  <img src="../assets/examples/photo-knockout-person.png" alt="">
  <div class="copy"><div class="kw">Vision</div><div class="sub">To help brands build lasting <b>love relationships</b> with humans.</div></div>
</div>
</body></html>
