<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Display → body sizes" viewport="700x280" --><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);background:var(--bg-surface);color:var(--fg-1);padding:20px 22px;-webkit-font-smoothing:antialiased}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--mist)}
  
 .r{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}
 .r:last-child{border:0}
 .r .n{font-family:var(--font-display);color:var(--ink);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
 .r .px{font-family:var(--font-mono);font-size:10px;color:var(--mist);width:54px;text-align:right}

</style></head><body><div class="lbl" style="margin-bottom:10px">Type scale</div><div class="r"><div class="n" style="font-size:40px;font-weight:800">Display</div><div class="px">64px</div></div><div class="r"><div class="n" style="font-size:40px;font-weight:700">H1</div><div class="px">48px</div></div><div class="r"><div class="n" style="font-size:36px;font-weight:700">H2</div><div class="px">36px</div></div><div class="r"><div class="n" style="font-size:27px;font-weight:600">H3</div><div class="px">27px</div></div><div class="r"><div class="n" style="font-size:21px;font-weight:700">H4</div><div class="px">21px</div></div><div class="r"><div class="n" style="font-size:16px;font-weight:400">Body</div><div class="px">16px</div></div></body></html>
