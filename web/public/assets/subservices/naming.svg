      <rect width="22" height="22" fill="#01D2CF"/>
      <rect width="11" height="22" fill="#00245F"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#01D2CF"/>
  <!-- magenta circle top-right -->
