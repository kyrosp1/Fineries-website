name: fineries-wp

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_dev_pw
      MARIADB_ROOT_PASSWORD: root_dev_pw
    volumes:
      - wpdb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_dev_pw
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wpcore:/var/www/html
      - ./wp-plugins/fineries-cms:/var/www/html/wp-content/plugins/fineries-cms
      - ./wp-plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro
      - wpuploads:/var/www/html/wp-content/uploads

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
    user: "33:33"
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_dev_pw
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wpcore:/var/www/html
      - ./wp-plugins/fineries-cms:/var/www/html/wp-content/plugins/fineries-cms
      - ./wp-plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro
      - wpuploads:/var/www/html/wp-content/uploads

volumes:
  wpdb:
  wpcore:
  wpuploads:
